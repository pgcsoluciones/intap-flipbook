<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Intap Flipbook</title>
    <link rel="stylesheet" href="/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@400;600;700&family=Montserrat:wght@400;600;700&family=Oswald:wght@400;600&family=Bebas+Neue&family=Roboto+Slab:wght@400;600;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;600;700&family=Lobster&family=Pacifico&family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
  </head>
  <body>
    <div id="flipbook-container">
      <div id="flipbook"></div>
    </div>
    <div id="controls">
      <button id="btn-zoom" title="Zoom">🔍</button>
      <button id="btn-thumbnails" title="Miniaturas">⊞</button>
      <button id="btn-autoplay" title="Reproducción automática">▶</button>
      <div class="ctrl-sep"></div>
      <button id="btn-first" title="Primera página">|←</button>
      <button id="btn-prev" title="Página anterior">←</button>
      <span id="page-info"></span>
      <button id="btn-next" title="Página siguiente">→</button>
      <button id="btn-last" title="Última página">→|</button>
      <div class="ctrl-sep"></div>
      <button id="btn-share" title="Compartir">↗</button>
      <button id="btn-print" title="Imprimir">🖨</button>
      <button id="btn-fullscreen" title="Pantalla completa">⛶</button>
    </div>
    <div id="thumbnail-panel">
      <div id="thumbnail-list"></div>
    </div>
    <script src="/flipbook.js"></script>
  </body>
</html>
