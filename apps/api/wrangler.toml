name = "intap-flipbook-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
CORS_ORIGIN = "https://app.intapflipbook.com"
JWT_EXPIRY_DAYS = "7"
R2_PUBLIC_BASE_URL = "https://media.intapflipbook.com"

# JWT_SECRET → wrangler secret put JWT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "intap-flipbook-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[[kv_namespaces]]
binding = "SESSIONS"
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "intap-flipbook-media"

[dev]
port = 8787
local_protocol = "http"
