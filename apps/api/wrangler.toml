name = "intap-flipbook-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
CORS_ORIGIN = "https://app.intapflipbook.com"
JWT_EXPIRY_DAYS = "7"
R2_PUBLIC_BASE_URL = "https://media.intapflipbook.com"

# JWT_SECRET → wrangler secret put JWT_SECRET

[[d1_databases]]
binding = "DB"
database_name = "intap-flipbook-db"
database_id = "f5e1ca62-8487-4250-a9d4-851d4880dcb3"

[[kv_namespaces]]
binding = "SESSIONS"
id = "8a0d51a9b1334c0c9c65e04109731ded"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "intap-flipbook-media"

[dev]
port = 8787
local_protocol = "http"
