name: Fix publication slug update Preview compatibility

on:
  push:
    branches:
      - audit/duplicate-publications-20260901
    paths:
      - .github/workflows/fix-publication-slug-update-preview.yml
      - scripts/fix-publication-slug-update-preview.py

permissions:
  contents: write

jobs:
  fix-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/duplicate-publications-20260901
          fetch-depth: 0

      - name: Preserve fixer
        run: cp scripts/fix-publication-slug-update-preview.py /tmp/fix-publication-slug-update-preview.py

      - name: Checkout exact feature candidate
        run: |
          git fetch origin feature/duplicate-publications-20260901
          git checkout -B feature/duplicate-publications-20260901 origin/feature/duplicate-publications-20260901
          test "$(git rev-parse HEAD)" = "0ef416569105d14389baa3f2ccbfa172501a699e"
          git config user.name "pgcsoluciones"
          git config user.email "fliaprince@gmail.com"

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Apply slug update compatibility fix
        run: python3 /tmp/fix-publication-slug-update-preview.py

      - name: Syntax and build checks
        run: |
          npx esbuild apps/api/src/routes/publications.ts --bundle --platform=node --format=esm --outfile=/tmp/publications-route.mjs
          npm --prefix apps/dashboard run build
          git diff --check

      - name: Focused API regression suite
        run: |
          node --test \
            apps/api/tests/publication-clone-helpers.test.mjs \
            apps/api/tests/publication-duplicate-contract.test.mjs \
            apps/api/tests/dynamic-marker-clone.test.mjs \
            apps/api/tests/dynamic-marker-independent-create.test.mjs \
            apps/api/tests/dynamic-marker-usage.test.mjs \
            apps/api/tests/pages-batch.test.mjs \
            apps/api/tests/pages-delete.test.mjs

      - name: Dashboard test suite
        run: node --test apps/dashboard/tests/*.test.mjs

      - name: Protected editor guardrails
        run: npm run verify:protected-editor

      - name: Commit fixed feature
        run: |
          git add \
            apps/api/src/routes/publications.ts \
            apps/api/tests/publication-duplicate-contract.test.mjs
          git commit -m "fix(publications): harden slug update for D1 Preview"
          git push origin HEAD:feature/duplicate-publications-20260901
