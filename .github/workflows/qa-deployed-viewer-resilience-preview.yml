name: QA deployed Viewer resilience Preview

on:
  push:
    branches:
      - audit/viewer-load-resilience-20260831
    paths:
      - .github/workflows/qa-deployed-viewer-resilience-preview.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployed-preview-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PREVIEW_BASE: https://qa-viewer-resilience-2026083.intap-flipbook-viewer.pages.dev
      PREVIEW_URL: https://qa-viewer-resilience-2026083.intap-flipbook-viewer.pages.dev/?publication=catalogo-padres-2026&preview=1&api_base=https%3A%2F%2Fintap-flipbook-api.fliaprince.workers.dev
    steps:
      - name: Checkout audit tooling
        uses: actions/checkout@v4
        with:
          ref: audit/viewer-load-resilience-20260831

      - name: Confirm deployed Preview responds
        run: |
          set -euo pipefail
          curl --retry 4 --retry-delay 2 --connect-timeout 10 --max-time 30 -fsSI "$PREVIEW_BASE/" | head -n 20

      - name: Configure read-only cross-origin probe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit-viewer-browser.mjs')
          s=p.read_text()
          needle="  '--disable-background-networking',\n"
          assert needle in s
          if "  '--disable-web-security',\n" not in s:
              s=s.replace(needle, needle+"  '--disable-web-security',\n", 1)
          p.write_text(s)
          PY

      - name: Run deployed desktop lifecycle QA
        env:
          INTAP_AUDIT_VIEWER_URL: ${{ env.PREVIEW_URL }}
          INTAP_BROWSER_AUDIT_OUTPUT: audit-preview-desktop.json
          INTAP_CHROME_DEBUG_PORT: '9225'
        run: node scripts/audit-viewer-browser.mjs

      - name: Require desktop progress and clean runtime
        run: |
          python3 - <<'PY'
          import json,re
          d=json.load(open('audit-preview-desktop.json'))
          final=d['snapshots'][-1]
          m=re.search(r'(\d+)\s*/\s*(\d+)', final.get('pageInfo',''))
          assert m, final.get('pageInfo')
          current,total=map(int,m.groups())
          assert current >= 18, (current,total)
          assert not d.get('exceptions'), d.get('exceptions')
          fatal_http=[e for e in d.get('http_errors',[]) if 'favicon.ico' not in e.get('url','')]
          assert not fatal_http, fatal_http
          fatal_net=[e for e in d.get('network_failures',[]) if not e.get('canceled')]
          assert not fatal_net, fatal_net
          built=sum(1 for p in final['pages'] if p.get('overlayBuilt'))
          assert built <= 4, built
          print(f'OK desktop Preview: {current}/{total}, overlays={built}, heapMiB={round(final.get("heap",{}).get("usedSize",0)/1048576,1)}, viewerWarnings={len(d.get("console_events",[]))}')
          PY

      - name: Configure mobile constrained browser
        run: |
          cp scripts/audit-viewer-browser.mjs scripts/audit-viewer-browser-mobile.mjs
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/audit-viewer-browser-mobile.mjs')
          s=p.read_text()
          s=s.replace("'--window-size=1365,900'", "'--window-size=390,844'", 1)
          needle="  await Promise.all([\n    cdp.send('Runtime.enable'),\n    cdp.send('Network.enable'),\n    cdp.send('Page.enable'),\n    cdp.send('Performance.enable'),\n  ])\n"
          assert needle in s
          replacement=needle+"\n  await cdp.send('Network.emulateNetworkConditions', {\n    offline: false,\n    latency: 150,\n    downloadThroughput: 200000,\n    uploadThroughput: 93750,\n    connectionType: 'cellular4g',\n  })\n"
          p.write_text(s.replace(needle,replacement,1))
          PY

      - name: Run deployed mobile constrained QA
        env:
          INTAP_AUDIT_VIEWER_URL: ${{ env.PREVIEW_URL }}
          INTAP_BROWSER_AUDIT_OUTPUT: audit-preview-mobile-slow.json
          INTAP_CHROME_DEBUG_PORT: '9226'
        run: node scripts/audit-viewer-browser-mobile.mjs

      - name: Require mobile progress and bounded overlays
        run: |
          python3 - <<'PY'
          import json,re
          d=json.load(open('audit-preview-mobile-slow.json'))
          final=d['snapshots'][-1]
          m=re.search(r'(\d+)\s*/\s*(\d+)', final.get('pageInfo',''))
          assert m, final.get('pageInfo')
          current,total=map(int,m.groups())
          assert current >= 18, (current,total)
          assert not d.get('exceptions'), d.get('exceptions')
          fatal_http=[e for e in d.get('http_errors',[]) if 'favicon.ico' not in e.get('url','')]
          assert not fatal_http, fatal_http
          fatal_net=[e for e in d.get('network_failures',[]) if not e.get('canceled')]
          assert not fatal_net, fatal_net
          built=sum(1 for p in final['pages'] if p.get('overlayBuilt'))
          assert built <= 4, built
          print(f'OK mobile Slow-4G Preview: {current}/{total}, overlays={built}, heapMiB={round(final.get("heap",{}).get("usedSize",0)/1048576,1)}, viewerWarnings={len(d.get("console_events",[]))}')
          PY

      - name: Upload deployed Preview QA reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployed-viewer-resilience-preview-qa
          path: |
            audit-preview-desktop.json
            audit-preview-mobile-slow.json
          if-no-files-found: warn
          retention-days: 7
