name: Apply Viewer page-turn responsiveness patch

on:
  push:
    branches:
      - audit/viewer-load-resilience-20260831
    paths:
      - .github/workflows/apply-viewer-page-turn-responsiveness.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/viewer-load-resilience-20260831
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "pgcsoluciones"
          git config user.email "fliaprince@gmail.com"

      - name: Patch clean product branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/viewer-load-resilience-20260831 deploy/preview-viewer-resilience-20260831
          git checkout -B fix/viewer-load-resilience-20260831 origin/fix/viewer-load-resilience-20260831

          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/viewer/src/flipbook.js')
          s = p.read_text()

          old = """  function ensureNearbyOverlays(pageIndex) {
            const realPage = pageNumOf(pageIndex)
            const jobs = []

            ;[realPage - 1, realPage, realPage + 1].forEach((pageNumber) => {
          """
          new = """  function ensureNearbyOverlays(pageIndex) {
            const realPage = pageNumOf(pageIndex)
            const jobs = []

            // PROTECTED: mantener preparado el pliego actual y el siguiente.
            // En escritorio el avance normal salta dos páginas; precalentar +2/+3
            // evita que el efecto de giro revele un overlay todavía frío.
            ;[realPage, realPage + 1, realPage + 2, realPage + 3].forEach((pageNumber) => {
          """
          assert old in s, 'No se encontró ensureNearbyOverlays esperado'
          s = s.replace(old, new, 1)

          old = """    const keep = new Set([
              currentRealPage - 1,
              currentRealPage,
              currentRealPage + 1,
              currentRealPage + 2,
            ].filter((pageNumber) => pageNumber >= 1 && pageNumber <= realCount))
          """
          new = """    const keep = new Set([
              currentRealPage,
              currentRealPage + 1,
              currentRealPage + 2,
              currentRealPage + 3,
            ].filter((pageNumber) => pageNumber >= 1 && pageNumber <= realCount))
          """
          assert old in s, 'No se encontró ventana LRU esperada'
          s = s.replace(old, new, 1)

          old = """      await waitUntilPageFlipRead()

              executeFlip()
              await waitForPageFlipCycle()
          """
          new = """      await waitUntilPageFlipRead()

              // Las entradas se disparaban después del evento `flip`, por lo que
              // durante el giro la hoja podía verse blanca aunque ya estuviera lista.
              // Arrancarlas justo al iniciar el giro hace que el contenido acompañe
              // al efecto físico sin volver a cargar overlays lejanos.
              triggerEntrances(targetIndex)
              executeFlip()
              await waitForPageFlipCycle()
          """
          assert old in s, 'No se encontró secuencia de ejecución de flip esperada'
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('apps/viewer/tests/viewer-load-resilience.test.mjs')
          ts = t.read_text()
          marker = "test('viewer starts target entrances with the page turn and prewarms the next spread'"
          if marker not in ts:
              ts += """

          test('viewer starts target entrances with the page turn and prewarms the next spread', () => {
            const source = fs.readFileSync(new URL('../src/flipbook.js', import.meta.url), 'utf8')
            assert.match(source, /\[realPage, realPage \+ 1, realPage \+ 2, realPage \+ 3\]/)
            assert.match(source, /currentRealPage,\s*currentRealPage \+ 1,\s*currentRealPage \+ 2,\s*currentRealPage \+ 3/)
            assert.match(source, /triggerEntrances\(targetIndex\)\s*\n\s*executeFlip\(\)/)
          })
          """
              t.write_text(ts)
          PY

          node --check apps/viewer/src/flipbook.js
          node --check apps/viewer/src/viewerRuntime.js
          node --test apps/viewer/tests/*.test.mjs
          git diff --check
          git add apps/viewer/src/flipbook.js apps/viewer/tests/viewer-load-resilience.test.mjs
          git commit -m "perf(viewer): prewarm next spread during page turn"
          git push origin HEAD:fix/viewer-load-resilience-20260831

      - name: Patch QA deployment branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B deploy/preview-viewer-resilience-20260831 origin/deploy/preview-viewer-resilience-20260831

          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/viewer/src/flipbook.js')
          s = p.read_text()

          old = """  function ensureNearbyOverlays(pageIndex) {
            const realPage = pageNumOf(pageIndex)
            const jobs = []

            ;[realPage - 1, realPage, realPage + 1].forEach((pageNumber) => {
          """
          new = """  function ensureNearbyOverlays(pageIndex) {
            const realPage = pageNumOf(pageIndex)
            const jobs = []

            // PROTECTED: mantener preparado el pliego actual y el siguiente.
            // En escritorio el avance normal salta dos páginas; precalentar +2/+3
            // evita que el efecto de giro revele un overlay todavía frío.
            ;[realPage, realPage + 1, realPage + 2, realPage + 3].forEach((pageNumber) => {
          """
          assert old in s, 'No se encontró ensureNearbyOverlays esperado en deploy'
          s = s.replace(old, new, 1)

          old = """    const keep = new Set([
              currentRealPage - 1,
              currentRealPage,
              currentRealPage + 1,
              currentRealPage + 2,
            ].filter((pageNumber) => pageNumber >= 1 && pageNumber <= realCount))
          """
          new = """    const keep = new Set([
              currentRealPage,
              currentRealPage + 1,
              currentRealPage + 2,
              currentRealPage + 3,
            ].filter((pageNumber) => pageNumber >= 1 && pageNumber <= realCount))
          """
          assert old in s, 'No se encontró ventana LRU esperada en deploy'
          s = s.replace(old, new, 1)

          old = """      await waitUntilPageFlipRead()

              executeFlip()
              await waitForPageFlipCycle()
          """
          new = """      await waitUntilPageFlipRead()

              // Las entradas se disparaban después del evento `flip`, por lo que
              // durante el giro la hoja podía verse blanca aunque ya estuviera lista.
              // Arrancarlas justo al iniciar el giro hace que el contenido acompañe
              // al efecto físico sin volver a cargar overlays lejanos.
              triggerEntrances(targetIndex)
              executeFlip()
              await waitForPageFlipCycle()
          """
          assert old in s, 'No se encontró secuencia de ejecución de flip esperada en deploy'
          s = s.replace(old, new, 1)
          p.write_text(s)

          t = Path('apps/viewer/tests/viewer-load-resilience.test.mjs')
          ts = t.read_text()
          marker = "test('viewer starts target entrances with the page turn and prewarms the next spread'"
          if marker not in ts:
              ts += """

          test('viewer starts target entrances with the page turn and prewarms the next spread', () => {
            const source = fs.readFileSync(new URL('../src/flipbook.js', import.meta.url), 'utf8')
            assert.match(source, /\[realPage, realPage \+ 1, realPage \+ 2, realPage \+ 3\]/)
            assert.match(source, /currentRealPage,\s*currentRealPage \+ 1,\s*currentRealPage \+ 2,\s*currentRealPage \+ 3/)
            assert.match(source, /triggerEntrances\(targetIndex\)\s*\n\s*executeFlip\(\)/)
          })
          """
              t.write_text(ts)
          PY

          node --check apps/viewer/src/flipbook.js
          node --check apps/viewer/src/viewerRuntime.js
          node --test apps/viewer/tests/*.test.mjs
          git diff --check
          git add apps/viewer/src/flipbook.js apps/viewer/tests/viewer-load-resilience.test.mjs
          git commit -m "perf(viewer): prewarm next spread during page turn"
          git push origin HEAD:deploy/preview-viewer-resilience-20260831
